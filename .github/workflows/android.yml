name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          echo "Android SDK: $ANDROID_HOME"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare installable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhnLnk-Android.apk
      - name: Save APK in Actions
        uses: actions/upload-artifact@v4
        with:
          name: PhnLnk-Android-debug
          path: PhnLnk-Android.apk
          if-no-files-found: error
      - name: Publish downloadable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          target_commitish: ${{ github.sha }}
          name: PhnLnk v0.3.0 Android companion preview
          prerelease: true
          make_latest: true
          fail_on_unmatched_files: true
          files: PhnLnk-Android.apk
          body: |
            Same APK for the Android host phone and the secondary Android device.
            NEW: native Android companion mode, dial pad, contacts, favorites,
            recent dial requests, and opt-in incoming call alerts.
            NEW: device-neutral branding and a dial pad for PC browsers.
            Pair once via QR scan or local IP and six-digit code.

            IMPORTANT: only call control works. You cannot have a two-way
            voice conversation from the secondary device. Audio stays on the
            SIM phone. Local trusted Wi-Fi only; unencrypted HTTP is not safe
            on public networks. No Shizuku or root needed.
            Do not rely on PhnLnk for emergency calls.
            This GitHub Actions preview uses a temporary debug signing key.
            You may need to uninstall the previous preview to install it.
