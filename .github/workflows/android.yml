name: Android CI and signed releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enforce permanent product requirements
        run: python3 tools/maintainer_check.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify encrypted voice protocol and EOF handling
        run: bash tools/test_voice_protocol.sh

      - name: Check Android SDK and D8
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -n "$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name d8 -type f -print -quit)"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build existing experimental audio test asset
        run: bash shellprobe/build.sh

      - name: Compile Android debug test artifact
        run: gradle --no-daemon :app:assembleDebug

      - name: Inspect Android debug test artifact
        run: |
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 1
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -F 'assets/phnlnk-probe.jar'

      - name: Build unsigned release candidate for permanent signing
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload unsigned release candidate (not installable)
        uses: actions/upload-artifact@v4
        with:
          name: PhnLnk-UNSIGNED-RELEASE-CANDIDATE
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Package official Android signing tools for controlled local signing
        run: |
          mkdir -p signing_tools
          APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER_JAR"
          test -n "$ZIPALIGN"
          cp "$APKSIGNER_JAR" signing_tools/apksigner.jar
          cp "$ZIPALIGN" signing_tools/zipalign
          CXX="$(find "$ANDROID_HOME/build-tools" -path '*/lib64/libc++.so' -type f | sort -V | tail -n 1)"
          test -n "$CXX"
          cp "$CXX" signing_tools/libc++.so
          chmod 755 signing_tools/zipalign

      - name: Upload Android signing tools for private offline signing
        uses: actions/upload-artifact@v4
        with:
          name: PhnLnk-LOCAL-SIGNING-TOOLS
          path: signing_tools/
          if-no-files-found: error

      - name: Keep debug test APK as Actions artifact, NOT a release
        uses: actions/upload-artifact@v4
        with:
          name: PhnLnk-DEBUG-NOT-UPDATABLE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Require permanent release signing credentials
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          KEY_BASE64: ${{ secrets.PHNLNK_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PHNLNK_STORE_PASSWORD }}
        run: |
          if [ -z "$KEY_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::No release published. Add the permanent PhnLnk signing keystore/password to repository Actions secrets first."
            exit 1
          fi
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/phnlnk-release.p12"
          chmod 600 "$RUNNER_TEMP/phnlnk-release.p12"
          echo "PHNLNK_KEYSTORE_FILE=$RUNNER_TEMP/phnlnk-release.p12" >> "$GITHUB_ENV"
          echo "PHNLNK_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build permanently signed release APK
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          gradle --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PhnLnk-Android.apk

      - name: Verify release signing certificate and APK integrity
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then echo "::error::Android apksigner unavailable"; exit 1; fi
          "$APKSIGNER" verify --verbose --print-certs PhnLnk-Android.apk
          unzip -t PhnLnk-Android.apk | tail -n 1

      - name: Get release version from app/build.gradle
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        id: version
        run: |
          VERSION="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          test -n "$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "title=PhnLnk v$VERSION signed experimental voice preview" >> "$GITHUB_OUTPUT"

      - name: Create transparent release notes
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          cat > notes.md <<'EOF'
          This is a PERMANENTLY SIGNED development preview.

          - Keeps the stock Android Phone app. Does not require the user
            to make PhnLnk the default dialer.
          - Does not require enabling Developer options or Wireless Debugging
            for basic call-control use.
          - Preserves basic local-network calling controls and saved pairings.
          - Includes an experimental authenticated, encrypted two-way voice
            transport and cellular audio backends.
          - NOT verified to transmit actual carrier voice on the physical MP01.
            A passing JVM protocol test or Android build is not an audio test.
          - The existing call-control HTTP and pairing channel remains
            UNENCRYPTED. Do not expose the local ports to the public internet.
          - Does not include a managed VPN or public internet relay.
          - Do not use for emergency calls.

          Android updates require the same package ID, higher version code and
          matching signing certificate. Earlier releases used temporary debug
          certificates, so migrating from them requires one final uninstall.
          Future versions signed with this SAME permanent key can update in place.

          See docs/INDEX.md, docs/SECURITY.md and docs/KNOWN_LIMITATIONS.md
          for current behavior, constraints, tests and device acceptance gates.
          EOF

      - name: Publish only the permanently signed APK
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.title }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: PhnLnk-Android.apk
          body_path: notes.md

      - name: Cleanup private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/phnlnk-release.p12"
