name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK and D8
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          find "$ANDROID_HOME/build-tools" -name d8 -type f | head -n 3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build local shell-UID audio helper
        run: bash shellprobe/build.sh

      - name: Prepare stable signing credentials if configured
        id: signing
        env:
          KEY_BASE64: ${{ secrets.PHNLNK_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PHNLNK_STORE_PASSWORD }}
        run: |
          if [ -n "$KEY_BASE64" ] && [ -n "$STORE_PASSWORD" ]; then
            printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/phnlnk-release.p12"
            echo "PHNLNK_KEYSTORE_FILE=$RUNNER_TEMP/phnlnk-release.p12" >> "$GITHUB_ENV"
            echo "PHNLNK_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile PhnLnk for Android
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            gradle --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk PhnLnk-Android.apk
          else
            gradle --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk PhnLnk-Android.apk
          fi

      - name: Verify probe is actually embedded
        run: |
          unzip -l PhnLnk-Android.apk | grep -F 'assets/phnlnk-probe.jar'
          unzip -t PhnLnk-Android.apk | tail -n 1

      - name: Save release notes
        run: |
          cat > notes.md <<'EOF'
          ## PhnLnk 0.6.0, in-app cellular audio feasibility test

          - Same Android host and companion APK, without extra audio hardware or Shizuku.
          - Host: new guided Wireless Debugging pairing through an Android notification.
          - Host: uses an embedded ADB client to start a local shell-UID helper.
          - Host: tests live cellular audio capture without saving or transmitting a recording.
          - Host: opt-in quiet test tone routed toward the cellular uplink for a consenting test call.
          - Existing dial pad, contacts, saved pairing, and call controls remain.

          IMPORTANT: this is NOT a finished two-way remote calling app.
          The host has not yet been tested for both audio directions on the MP01.
          The secondary Android device still cannot carry the call audio.
          A one-time Developer options + USB and Wireless Debugging pairing is required.

          The helper binds only to 127.0.0.1 with a random local secret.
          Use on trusted Wi-Fi. Leave port 47321 off the public internet.
          Wireless Debugging enables ADB access to previously authorized devices.
          Test only on calls you control and with the other person's consent.
          Never use PhnLnk for emergency calls.
          EOF
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            echo "" >> notes.md
            echo "Signing: permanent signing key configured. Subsequent same-key versions can update in place." >> notes.md
          else
            echo "" >> notes.md
            echo "Signing: temporary debug key. Install over a previous release may FAIL due to certificate mismatch." >> notes.md
            echo "Permanent upgrade signing requires PHNLNK_KEYSTORE_B64 and PHNLNK_STORE_PASSWORD in GitHub Actions secrets." >> notes.md
          fi

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhnLnk-Android-debug
          path: PhnLnk-Android.apk
          if-no-files-found: error

      - name: Publish preview APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0
          target_commitish: ${{ github.sha }}
          name: PhnLnk v0.6.0 app-only audio capability test
          prerelease: true
          make_latest: true
          fail_on_unmatched_files: true
          files: PhnLnk-Android.apk
          body_path: notes.md
