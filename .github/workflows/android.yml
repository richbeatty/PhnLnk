name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          echo "Android SDK: $ANDROID_HOME"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare easy-download APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhnLnk-MP01.apk
      - name: Save APK in Actions
        uses: actions/upload-artifact@v4
        with:
          name: PhnLnk-MP01-debug
          path: PhnLnk-MP01.apk
          if-no-files-found: error
      - name: Publish downloadable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1
          target_commitish: ${{ github.sha }}
          name: PhnLnk v0.2.1 quick pairing preview
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: PhnLnk-MP01.apk
          body: |
            Download the PhnLnk-MP01.apk asset below.
            New: scan the QR code on the MP01 or enter a one-time six-digit code.
            Paired browsers reconnect automatically without another login.
            This APK is a local call-control preview only. Cellular call audio
            does not reach the remote browser. Do not use for emergencies.
            Only connect over trusted private Wi-Fi. Do not expose the
            host HTTP port publicly. Shizuku and root are not required.
