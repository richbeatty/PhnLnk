name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's standard Ubuntu runner already includes the Android SDK and API 35.
      # setup-android currently fails while accepting legacy optional SDK licenses.
      - name: Check preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          echo "Android SDK: $ANDROID_HOME"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Save Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PhnLnk-MP01-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
