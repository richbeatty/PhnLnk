name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          echo "Android SDK: $ANDROID_HOME"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare easy-download APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhnLnk-MP01.apk

      - name: Save APK in Actions
        uses: actions/upload-artifact@v4
        with:
          name: PhnLnk-MP01-debug
          path: PhnLnk-MP01.apk
          if-no-files-found: error

      - name: Publish downloadable GitHub preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          target_commitish: ${{ github.sha }}
          name: PhnLnk v0.1.1 MP01 control preview
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: PhnLnk-MP01.apk
          body: |
            Download `PhnLnk-MP01.apk` below and install it on the MP01.

            IMPORTANT: This is a call-control preview, not a finished Beeper-like calling app.
            You can dial, answer, and end AT&T calls through a browser on a trusted local network,
            but cellular call AUDIO is NOT relayed to your tablet or computer.
            No Shizuku or root is required to install or test this control-only version.
            Never use the remote dialer for emergency calls.

            See the project README for setup, privacy limitations, and the unresolved two-way audio blocker.
