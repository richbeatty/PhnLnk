pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            name = 'Linphone official SDK'
            url = uri('https://download.linphone.org/maven_repository')
            content { includeGroup('org.linphone.minimal') }
        }
    }
}
rootProject.name = 'PhnLnk'
include ':app'
