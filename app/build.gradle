plugins {
    id 'com.android.application'
}

def signingFile = System.getenv('PHNLNK_KEYSTORE_FILE')
def signingPassword = System.getenv('PHNLNK_STORE_PASSWORD')

android {
    namespace 'com.richbeatty.phnlnk'
    compileSdk 35
    defaultConfig {
        applicationId 'com.richbeatty.phnlnk'
        minSdk 30
        targetSdk 34
        versionCode 8
        versionName '0.6.0'
    }

    signingConfigs {
        persistent {
            if (signingFile && signingPassword) {
                storeFile file(signingFile)
                storePassword signingPassword
                keyAlias 'phnlnk'
                keyPassword signingPassword
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile && signingPassword) signingConfig signingConfigs.persistent
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.81'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
    implementation 'org.conscrypt:conscrypt-android:2.7.0'
}
