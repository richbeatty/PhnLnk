plugins {
    id 'com.android.application'
}
android {
    namespace 'com.richbeatty.phnlnk'
    compileSdk 35
    defaultConfig {
        applicationId 'com.richbeatty.phnlnk'
        minSdk 30
        targetSdk 34
        versionCode 4
        versionName '0.2.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
