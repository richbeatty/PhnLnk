plugins {
    id 'com.android.application'
}

android {
    namespace 'com.richbeatty.phnlnk'
    compileSdk 35

    defaultConfig {
        applicationId 'com.richbeatty.phnlnk'
        minSdk 30
        targetSdk 34
        versionCode 2
        versionName '0.1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
